<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo</title>
<link rel="icon" href="logo.jpg" type="image/jpeg">
<style>
  /* Jira / Atlassian Design System tokens */
  :root {
    /* Surface */
    --bg:           #F7F8F9;
    --bg-sunken:    #F1F2F4;
    --bg-elevated:  #FFFFFF;
    /* Text */
    --text:         #172B4D;
    --text-subtle:  #44546F;
    --text-subtlest:#626F86;
    --text-disabled:#8590A2;
    --text-inverse: #FFFFFF;
    /* Border */
    --border:        #DCDFE4;
    --border-bold:   #B3B9C4;
    --border-focused:#388BFF;
    /* Brand / CTA */
    --brand:        #0C66E4;
    --brand-hover:  #0055CC;
    --brand-active: #09326C;
    /* Status pills */
    --todo-bg: #DCDFE4;   --todo-fg: #44546F;
    --prog-bg: #CCE0FF;   --prog-fg: #0055CC;
    --done-bg: #DCFFF1;   --done-fg: #216E4E;
    /* Semantic */
    --danger:       #CA3521;
    --danger-hover: #AE2E24;
    --drop:         #388BFF;
    /* Radii */
    --r-sm: 4px; --r-md: 6px; --r-lg: 8px;
    /* Shadow */
    --sh-raised:  0 1px 1px rgba(9,30,66,0.25), 0 0 1px rgba(9,30,66,0.31);
    --sh-overlay: 0 4px 8px -2px rgba(9,30,66,0.25), 0 0 1px rgba(9,30,66,0.31);
    --sh-focus:   0 0 0 2px rgba(56,139,255,0.5);
    /* Motion */
    --d-fast: 100ms; --d-medium: 200ms;
    --ease: cubic-bezier(0.4, 0.0, 0.2, 1);
    /* Font */
    --font-body: 'Charlie Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    margin: 0 0 24px;
  }
  .brand .logo {
    width: 44px; height: 44px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: var(--sh-raised);
  }
  .brand h1 {
    font-size: 28px; margin: 0; font-weight: 700;
    line-height: 1.2; letter-spacing: -0.01em;
    color: var(--text);
    background: linear-gradient(135deg, #2A8CF0 0%, #4FD1B0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .input-row {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px;
    box-shadow: var(--sh-raised);
  }
  #title, #desc {
    width: 100%; font-family: inherit;
    border: 2px solid var(--border); border-radius: var(--r-sm);
    background: var(--bg-elevated); color: var(--text); outline: none;
    transition: border-color var(--d-medium) var(--ease),
                box-shadow var(--d-medium) var(--ease);
  }
  #title {
    height: 40px; padding: 0 12px; font-size: 14px; font-weight: 500;
  }
  #desc {
    padding: 10px 12px; font-size: 14px; resize: vertical; min-height: 64px;
    line-height: 1.5;
  }
  #title::placeholder, #desc::placeholder { color: var(--text-disabled); }
  #title:hover, #desc:hover { border-color: var(--border-bold); }
  #title:focus, #desc:focus {
    border-color: var(--border-focused);
    box-shadow: var(--sh-focus);
  }
  #add {
    align-self: flex-end;
    height: 40px; padding: 0 16px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    border: none; border-radius: var(--r-md);
    background: var(--brand); color: var(--text-inverse);
    cursor: pointer;
    transition: background var(--d-medium) var(--ease),
                box-shadow var(--d-medium) var(--ease);
  }
  #add:hover { background: var(--brand-hover); }
  #add:active { background: var(--brand-active); }
  #add:focus-visible { box-shadow: var(--sh-focus); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr; gap: 12px; }
    .container { padding: 16px 12px; }
  }
  .col {
    background: var(--bg-sunken);
    border-radius: var(--r-lg);
    padding: 12px;
    min-height: 200px;
    display: flex; flex-direction: column;
    transition: outline-color var(--d-fast) var(--ease);
  }
  .col.drag-over {
    outline: 2px dashed var(--drop); outline-offset: -2px;
  }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .col-title {
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 9999px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }
  .col-title.todo        { background: var(--todo-bg); color: var(--todo-fg); }
  .col-title.in_progress { background: var(--prog-bg); color: var(--prog-fg); }
  .col-title.done        { background: var(--done-bg); color: var(--done-fg); }
  .count {
    color: var(--text-subtlest);
    font-size: 12px; font-weight: 500;
  }

  .list { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 40px; }
  .list li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 12px; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: var(--r-lg);
    margin-bottom: 8px; user-select: none;
    box-shadow: var(--sh-raised);
    transition: box-shadow var(--d-medium) var(--ease),
                border-color var(--d-medium) var(--ease),
                opacity var(--d-fast) var(--ease);
  }
  .list li:hover { box-shadow: var(--sh-overlay); }
  .list li.dragging { opacity: 0.4; }
  .list li.drop-before { border-top: 3px solid var(--drop); }
  .list li.drop-after  { border-bottom: 3px solid var(--drop); }
  .handle {
    cursor: grab; color: var(--text-subtlest); font-size: 16px;
    padding: 2px; touch-action: none; line-height: 1.4;
    flex-shrink: 0;
  }
  .handle:active { cursor: grabbing; }
  .task-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .task-title {
    font-size: 14px; font-weight: 500;
    color: var(--text);
    word-break: break-word; line-height: 1.45;
  }
  .task-desc {
    font-size: 12px; font-weight: 400;
    color: var(--text-subtle);
    word-break: break-word; white-space: pre-wrap; line-height: 1.5;
  }
  li.is-done .task-title {
    text-decoration: line-through; color: var(--text-subtlest);
  }
  li.is-done .task-desc {
    text-decoration: line-through; color: var(--text-disabled);
  }
  .delete {
    background: none; border: none;
    color: var(--text-subtlest);
    font-size: 18px; cursor: pointer;
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1; border-radius: var(--r-sm);
    flex-shrink: 0;
    transition: background var(--d-fast) var(--ease),
                color var(--d-fast) var(--ease);
  }
  .delete:hover {
    color: var(--danger);
    background: var(--bg-sunken);
  }
  .empty {
    text-align: center;
    color: var(--text-disabled);
    padding: 16px 0; font-size: 12px;
    font-style: normal;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <img src="logo.jpg" alt="Tempo" class="logo">
      <h1>Tempo</h1>
    </div>
    <div class="input-row">
      <input id="title" type="text" placeholder="เพิ่ม task ใหม่..." autofocus>
      <textarea id="desc" placeholder="รายละเอียด (ไม่บังคับ) — Cmd/Ctrl+Enter เพื่อเพิ่ม" rows="2"></textarea>
      <button id="add">Add</button>
    </div>
    <div class="board" id="board"></div>
  </div>

<script>
  const KEY = "tasks_v1";
  const STATUSES = ["todo", "in_progress", "done"];
  const STATUS_LABEL = { todo: "Todo", in_progress: "In Progress", done: "Done" };

  let tasks = load();

  function load() {
    try {
      const parsed = JSON.parse(localStorage.getItem(KEY) ?? "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.warn("tasks_v1 corrupt, falling back to []", e);
      return [];
    }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(tasks)); }

  const $board = document.getElementById("board");
  const $title = document.getElementById("title");
  const $desc = document.getElementById("desc");
  const $add = document.getElementById("add");

  function render() {
    $board.innerHTML = "";
    for (const status of STATUSES) {
      const items = tasks.filter(t => t.status === status);

      const col = document.createElement("div");
      col.className = "col";
      col.dataset.status = status;

      const head = document.createElement("div");
      head.className = "col-head";
      const ctitle = document.createElement("span");
      ctitle.className = "col-title " + status;
      ctitle.textContent = STATUS_LABEL[status];
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = items.length;
      head.append(ctitle, count);
      col.appendChild(head);

      const ul = document.createElement("ul");
      ul.className = "list";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "ว่าง";
        ul.appendChild(empty);
      }

      for (const t of items) {
        const li = document.createElement("li");
        li.dataset.id = t.id;
        li.draggable = true;
        if (t.status === "done") li.classList.add("is-done");

        const handle = document.createElement("span");
        handle.className = "handle";
        handle.textContent = "≡";

        const body = document.createElement("div");
        body.className = "task-body";
        const titleEl = document.createElement("span");
        titleEl.className = "task-title";
        titleEl.textContent = t.title;
        body.appendChild(titleEl);
        if (t.description) {
          const descEl = document.createElement("span");
          descEl.className = "task-desc";
          descEl.textContent = t.description;
          body.appendChild(descEl);
        }

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";
        del.setAttribute("aria-label", "ลบ");
        del.addEventListener("click", () => remove(t.id));

        li.append(handle, body, del);
        attachItemDnD(li, handle);
        ul.appendChild(li);
      }

      attachColDnD(col, ul);
      col.appendChild(ul);
      $board.appendChild(col);
    }
  }

  function add() {
    const title = $title.value.trim();
    if (!title) return;
    const description = $desc.value.trim();
    tasks.unshift({
      id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
      title,
      description,
      status: "todo",
      createdAt: Date.now(),
    });
    $title.value = "";
    $desc.value = "";
    $title.focus();
    save(); render();
  }

  function remove(id) {
    if (!confirm("ลบ task นี้?")) return;
    tasks = tasks.filter(x => x.id !== id);
    save(); render();
  }

  // ---- DnD: between/within columns ----
  let dragId = null;

  function clearMarkers() {
    for (const el of $board.querySelectorAll(".drop-before,.drop-after")) {
      el.classList.remove("drop-before", "drop-after");
    }
    for (const el of $board.querySelectorAll(".col.drag-over")) {
      el.classList.remove("drag-over");
    }
  }

  function moveTo(targetStatus, beforeId) {
    const fromIdx = tasks.findIndex(x => x.id === dragId);
    if (fromIdx < 0) return;
    const [moved] = tasks.splice(fromIdx, 1);
    moved.status = targetStatus;

    if (beforeId) {
      const i = tasks.findIndex(x => x.id === beforeId);
      tasks.splice(i >= 0 ? i : tasks.length, 0, moved);
    } else {
      // append to end (after last item of that status)
      let lastIdx = -1;
      tasks.forEach((t, i) => { if (t.status === targetStatus) lastIdx = i; });
      tasks.splice(lastIdx + 1, 0, moved);
    }
    save();
  }

  function attachItemDnD(li, handle) {
    li.addEventListener("dragstart", e => {
      dragId = li.dataset.id;
      li.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
    });
    li.addEventListener("dragend", () => {
      li.classList.remove("dragging");
      clearMarkers();
      dragId = null;
    });
    li.addEventListener("dragover", e => {
      if (!dragId || li.dataset.id === dragId) return;
      e.preventDefault();
      const r = li.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      clearMarkers();
      li.classList.add(before ? "drop-before" : "drop-after");
    });
    li.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      if (!dragId || li.dataset.id === dragId) return;
      const targetStatus = li.closest(".col").dataset.status;
      const r = li.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      const beforeId = before ? li.dataset.id : nextSiblingId(li);
      moveTo(targetStatus, beforeId);
      clearMarkers(); dragId = null;
      render();
    });

    // Touch fallback via pointer events on handle
    handle.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse") return;
      e.preventDefault();
      dragId = li.dataset.id;
      li.classList.add("dragging");
      handle.setPointerCapture(e.pointerId);

      const onMove = ev => {
        const target = pickTarget(ev.clientX, ev.clientY);
        clearMarkers();
        if (!target) return;
        target.col.classList.add("drag-over");
        if (target.beforeEl) target.beforeEl.classList.add("drop-before");
      };
      const onUp = ev => {
        const target = pickTarget(ev.clientX, ev.clientY);
        if (target) {
          const beforeId = target.beforeEl ? target.beforeEl.dataset.id : null;
          moveTo(target.col.dataset.status, beforeId);
        }
        li.classList.remove("dragging");
        clearMarkers();
        dragId = null;
        try { handle.releasePointerCapture(e.pointerId); } catch {}
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        handle.removeEventListener("pointercancel", onUp);
        render();
      };
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
      handle.addEventListener("pointercancel", onUp);
    });
  }

  function nextSiblingId(li) {
    const next = li.nextElementSibling;
    return next && next.dataset.id ? next.dataset.id : null;
  }

  function attachColDnD(col, ul) {
    col.addEventListener("dragover", e => {
      if (!dragId) return;
      e.preventDefault();
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", e => {
      if (e.target === col) col.classList.remove("drag-over");
    });
    col.addEventListener("drop", e => {
      e.preventDefault();
      if (!dragId) return;
      // dropped on column (not on a specific item) → append to end of column
      moveTo(col.dataset.status, null);
      clearMarkers(); dragId = null;
      render();
    });
  }

  function pickTarget(x, y) {
    const cols = $board.querySelectorAll(".col");
    for (const col of cols) {
      const r = col.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        const items = [...col.querySelectorAll("li")].filter(el => el.dataset.id !== dragId);
        for (const el of items) {
          const ir = el.getBoundingClientRect();
          if (y < ir.top + ir.height / 2) return { col, beforeEl: el };
        }
        return { col, beforeEl: null };
      }
    }
    return null;
  }

  $add.addEventListener("click", add);
  $title.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  $desc.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); }
  });

  render();
</script>
</body>
</html>
